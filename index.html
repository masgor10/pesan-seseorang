<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesan yang Tak Tersampaikan</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>Pesan Yang Tak Tersampaikan</h1>
        <p>Tinggalkan pesan, biarkan dunia ikut merasakan kata-katamu.</p>
    </header>

    <main>
        <div class="form-box">
            <input id="nama" type="text" placeholder="Nama kamu..." />
            <textarea id="pesan" placeholder="Tulis pesanmu..."></textarea>
            <button onclick="kirimPesan()">Kirim Pesan</button>
        </div>

        <h2 class="judul-daftar">Pesan Pengunjung</h2>

        <div id="daftar-pesan" class="daftar-pesan"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>

<script src="script.js"></script>
</body>
</html>
